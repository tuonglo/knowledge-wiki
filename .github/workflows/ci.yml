name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (web, api, shared)
    runs-on: ubuntu-latest
    # API integration tests need a real Postgres. Tests create/migrate `kw_test` themselves.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kw
          POSTGRES_PASSWORD: kw
          POSTGRES_DB: kw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kw" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://kw:kw@localhost:5432/kw
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  python:
    name: Python (ai)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  stack:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: [typescript, python]
    steps:
      - uses: actions/checkout@v7
      # The API won't start without signing keys. Make throwaway ones for this run;
      # Compose reads .env automatically. (OAuth stays unconfigured → providers disabled.)
      - name: Generate throwaway JWT keys
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/jwt.pem"
          openssl pkey -in "$RUNNER_TEMP/jwt.pem" -pubout -out "$RUNNER_TEMP/jwt.pub"
          echo "JWT_PRIVATE_KEY=$(base64 -w0 "$RUNNER_TEMP/jwt.pem")" >> .env
          echo "JWT_PUBLIC_KEY=$(base64 -w0 "$RUNNER_TEMP/jwt.pub")" >> .env
      - run: docker compose --profile app up -d --build --wait
      - name: Health checks
        run: |
          for url in localhost:4000/health localhost:8000/health localhost:3000; do
            curl -fsS --retry 10 --retry-connrefused --retry-delay 2 "http://$url" && echo
          done
      # /health only proves the DB is reachable. Prove the schema is there too:
      # this query fails if the migrate service didn't run.
      - name: Migrations applied
        run: docker compose exec -T postgres psql -U kw -d kw -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM "User"' -c 'SELECT * FROM kw_document_roles($$nobody$$)'
      - name: Protected routes reject anonymous requests
        run: test "$(curl -s -o /dev/null -w '%{http_code}' localhost:4000/me)" = 401
      - if: failure()
        run: docker compose --profile app logs
      - if: always()
        run: docker compose --profile app down -v
